#
#
# ~chewygumxx/.github.git
# ::: :/.github/workflows/commitlint.yaml
#
#

# Reusable: lints the commits a push or pull request introduces against the
# caller's own commitlint config. Triggers and concurrency belong to the
# caller; the `github` context seen here is the caller's event.
#
#   jobs:
#       commitlint:
#           uses: chewygumxx/.github/.github/workflows/commitlint.yaml@v1

name: Lint Commit Messages

on:
    workflow_call: {}

permissions:
    contents: read
    pull-requests: read

jobs:
    commitlint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Setup Node and NPM
              uses: jdx/mise-action@v4

            - name: Cache NPM
              uses: actions/cache@v6
              with:
                  path: ~/.npm
                  key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
                  restore-keys: npm-${{ runner.os }}-

            - name: NPM Clean Install
              run: npm ci

            - name: Lint Pull Request Commits
              if: github.event_name == 'pull_request'
              env:
                  FROM: ${{ github.event.pull_request.base.sha }}
                  TO: ${{ github.event.pull_request.head.sha }}
              run: npx --no -- commitlint --from "$FROM" --to "$TO" --verbose

            # `before` is all zeros when the push creates the branch, and
            # absent on workflow_dispatch; lint only the tip in those cases.
            - name: Lint Pushed Commits
              if: github.event_name == 'push' && !startsWith(github.event.before, '0000000')
              env:
                  FROM: ${{ github.event.before }}
                  TO: ${{ github.sha }}
              run: npx --no -- commitlint --from "$FROM" --to "$TO" --verbose

            - name: Lint Latest Commit
              if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.before, '0000000'))
              run: npx --no -- commitlint --last --verbose
