name: Lint EditorConfig
description: >-
    Checks tracked files against `.editorconfig`: charset, line endings,
    trailing whitespace, final newlines and indent style.

inputs:
    args:
        description: >-
            Arguments for editorconfig-checker. Indent size is off by default:
            YAML sequences, Markdown list continuations and verbatim licence
            text legitimately break it, and formatters own indentation anyway.
        default: -disable-indent-size

runs:
    using: composite
    steps:
        - name: Setup mise
          uses: jdx/mise-action@v4
          with:
              install: false
              add_shims_to_path: false
              working_directory: ${{ github.action_path }}/..
              cache_key_prefix: chewygumxx-lint

        - name: Install editorconfig-checker
          shell: bash
          run: '"$GITHUB_ACTION_PATH/../lib/setup-tools.sh" aqua:editorconfig-checker/editorconfig-checker'

        - name: Lint
          shell: bash
          env:
              ARGS: ${{ inputs.args }}
          # ARGS is split on whitespace deliberately, to allow several flags.
          run: editorconfig-checker $ARGS
