name: Detect Lintable Files
description: >-
    Reports which kinds of file the checked-out repository tracks, for gating
    the lint jobs that apply to them.

outputs:
    actions:
        description: '"true" when workflows exist under .github/workflows'
        value: ${{ steps.detect.outputs.actions }}
    shell:
        description: '"true" when sh, bash, dash or ksh scripts are tracked'
        value: ${{ steps.detect.outputs.shell }}
    toml:
        description: '"true" when TOML files are tracked'
        value: ${{ steps.detect.outputs.toml }}
    editorconfig:
        description: '"true" when an .editorconfig is tracked at the root'
        value: ${{ steps.detect.outputs.editorconfig }}

runs:
    using: composite
    steps:
        # Presence across the whole repository, not only changed files: a
        # config or tool change can break files the push did not touch.
        - name: Detect
          id: detect
          shell: bash
          run: |
              any() { grep -qz . && echo true || echo false; }
              {
                  echo "actions=$(git ls-files -z -- '.github/workflows/*.yml' '.github/workflows/*.yaml' | any)"
                  echo "shell=$("$GITHUB_ACTION_PATH/../lib/shell-files.sh" | any)"
                  echo "toml=$(git ls-files -z -- '*.toml' | any)"
                  echo "editorconfig=$(git ls-files -z -- .editorconfig | any)"
              } | tee -a "$GITHUB_OUTPUT"
