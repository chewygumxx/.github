# ::: :/.github/workflows/self-test.yaml
#
#

# Runs this repository's composite actions against itself from the working
# tree, so a change to an action is exercised before a tag publishes it.
# (The reusable workflows reference the actions by tag and so cannot.)
# `commitlint.yaml` and `lint.yaml` reference no actions of their own, so
# they are called from the working tree too: they check this repository's
# commits and its `check` script, and exercise themselves in doing so.

name: Self Test

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch: {}

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Detect
              id: detect
              uses: ./actions/detect

            - name: Lint Workflows
              if: steps.detect.outputs.actions == 'true'
              uses: ./actions/lint-actions

            - name: Lint Shell Scripts
              if: steps.detect.outputs.shell == 'true'
              uses: ./actions/lint-shell

            - name: Lint Zsh
              if: steps.detect.outputs.zsh == 'true'
              uses: ./actions/lint-zsh

            - name: Lint TOML
              if: steps.detect.outputs.toml == 'true'
              uses: ./actions/lint-toml

            - name: Lint YAML
              if: steps.detect.outputs.yaml == 'true'
              uses: ./actions/lint-yaml

            - name: Lint EditorConfig
              if: steps.detect.outputs.editorconfig == 'true'
              uses: ./actions/lint-editorconfig

            - name: Lint Em Dashes
              uses: ./actions/lint-emdash

    commitlint:
        permissions:
            contents: read
            pull-requests: read
        uses: ./.github/workflows/commitlint.yaml

    check:
        permissions:
            contents: read
        uses: ./.github/workflows/lint.yaml
