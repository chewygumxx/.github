#
#
# ~chewygumxx/.github.git
# ::: :/.github/workflows/lint-format.yaml
#
#

# Reusable: repository-agnostic linting and format checks, one job per kind
# of file. A job runs only when its kind of file is tracked and changed since
# the last commit known to pass, and then checks only the changed files,
# unless a file configuring its linter changed (see actions/lib/base.sh and
# actions/lib/scope.sh). workflow_dispatch checks everything. A job skipped
# by its condition still satisfies a required status check. Tools are pinned
# in this repository's `actions/mise.toml`, independent of the caller's.
#
# Linters a repository pins itself (Biome, remark, commitlint via npm) are
# left to that repository's own checks, so CI and local hooks agree. YAML is
# checked here because Biome does not read it.
#
#   jobs:
#       lint-format:
#           uses: chewygumxx/.github/.github/workflows/lint-format.yaml@v1

name: Lint and Format

on:
    workflow_call:
        inputs:
            ref:
                description: Commit to check out; empty for the triggering commit
                type: string
                default: ""
            actions:
                description: Lint workflows with actionlint
                type: boolean
                default: true
            shell:
                description: Lint sh and bash scripts with shellcheck and shfmt
                type: boolean
                default: true
            zsh:
                description: Lint zsh scripts, or all with a shuck config, with shuck
                type: boolean
                default: true
            toml:
                description: Lint and check TOML formatting with tombi
                type: boolean
                default: true
            yaml:
                description: Check YAML formatting with prettier and lint it with yamllint
                type: boolean
                default: true
            editorconfig:
                description: Check files against .editorconfig
                type: boolean
                default: true
            emdash:
                description: Reject em dashes (U+2014) in tracked text files
                type: boolean
                default: true
            editorconfig-args:
                description: Arguments for editorconfig-checker
                type: string
                default: -disable-indent-size
        outputs:
            actions:
                description: '"true" when workflows are tracked'
                value: ${{ jobs.detect.outputs.actions }}
            shell:
                description: '"true" when sh or bash scripts are tracked and shuck is not configured'
                value: ${{ jobs.detect.outputs.shell }}
            zsh:
                description: '"true" when zsh scripts are tracked or shuck is configured'
                value: ${{ jobs.detect.outputs.zsh }}
            toml:
                description: '"true" when TOML files are tracked'
                value: ${{ jobs.detect.outputs.toml }}
            yaml:
                description: '"true" when YAML files are tracked'
                value: ${{ jobs.detect.outputs.yaml }}
            editorconfig:
                description: '"true" when .editorconfig is tracked'
                value: ${{ jobs.detect.outputs.editorconfig }}

permissions:
    contents: read

jobs:
    detect:
        runs-on: ubuntu-latest

        outputs:
            actions: ${{ steps.detect.outputs.actions }}
            shell: ${{ steps.detect.outputs.shell }}
            zsh: ${{ steps.detect.outputs.zsh }}
            toml: ${{ steps.detect.outputs.toml }}
            yaml: ${{ steps.detect.outputs.yaml }}
            editorconfig: ${{ steps.detect.outputs.editorconfig }}
            base: ${{ steps.detect.outputs.base }}
            actions-scope: ${{ steps.detect.outputs.actions-scope }}
            shell-scope: ${{ steps.detect.outputs.shell-scope }}
            zsh-scope: ${{ steps.detect.outputs.zsh-scope }}
            toml-scope: ${{ steps.detect.outputs.toml-scope }}
            yaml-scope: ${{ steps.detect.outputs.yaml-scope }}
            editorconfig-scope: ${{ steps.detect.outputs.editorconfig-scope }}
            emdash-scope: ${{ steps.detect.outputs.emdash-scope }}

        steps:
            # The whole history, to find the last passing commit in.
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Detect
              id: detect
              uses: chewygumxx/.github/actions/detect@v1

    actions:
        needs: detect
        if: inputs.actions && needs.detect.outputs.actions-scope != 'none'
        runs-on: ubuntu-latest

        steps:
            # History only to diff against a base. Written this way round, as
            # `&& 0 ||` would take 0 as false and always give 1.
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref }}
                  fetch-depth: ${{ needs.detect.outputs.base == '' && 1 || 0 }}
                  persist-credentials: false

            - name: Lint Workflows
              uses: chewygumxx/.github/actions/lint-actions@v1
              with:
                  base: ${{ needs.detect.outputs.base }}

    shell:
        needs: detect
        if: inputs.shell && needs.detect.outputs.shell-scope != 'none'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref }}
                  fetch-depth: ${{ needs.detect.outputs.base == '' && 1 || 0 }}
                  persist-credentials: false

            - name: Lint Shell Scripts
              uses: chewygumxx/.github/actions/lint-shell@v1
              with:
                  base: ${{ needs.detect.outputs.base }}

    zsh:
        needs: detect
        if: inputs.zsh && needs.detect.outputs.zsh-scope != 'none'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref }}
                  fetch-depth: ${{ needs.detect.outputs.base == '' && 1 || 0 }}
                  persist-credentials: false

            - name: Lint Zsh
              uses: chewygumxx/.github/actions/lint-zsh@v1
              with:
                  base: ${{ needs.detect.outputs.base }}

    toml:
        needs: detect
        if: inputs.toml && needs.detect.outputs.toml-scope != 'none'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref }}
                  fetch-depth: ${{ needs.detect.outputs.base == '' && 1 || 0 }}
                  persist-credentials: false

            - name: Lint TOML
              uses: chewygumxx/.github/actions/lint-toml@v1
              with:
                  base: ${{ needs.detect.outputs.base }}

    yaml:
        needs: detect
        if: inputs.yaml && needs.detect.outputs.yaml-scope != 'none'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref }}
                  fetch-depth: ${{ needs.detect.outputs.base == '' && 1 || 0 }}
                  persist-credentials: false

            - name: Lint YAML
              uses: chewygumxx/.github/actions/lint-yaml@v1
              with:
                  base: ${{ needs.detect.outputs.base }}

    editorconfig:
        needs: detect
        if: inputs.editorconfig && needs.detect.outputs.editorconfig-scope != 'none'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref }}
                  fetch-depth: ${{ needs.detect.outputs.base == '' && 1 || 0 }}
                  persist-credentials: false

            - name: Lint EditorConfig
              uses: chewygumxx/.github/actions/lint-editorconfig@v1
              with:
                  base: ${{ needs.detect.outputs.base }}
                  args: ${{ inputs.editorconfig-args }}

    emdash:
        needs: detect
        if: inputs.emdash && needs.detect.outputs.emdash-scope != 'none'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref }}
                  fetch-depth: ${{ needs.detect.outputs.base == '' && 1 || 0 }}
                  persist-credentials: false

            - name: Lint Em Dashes
              uses: chewygumxx/.github/actions/lint-emdash@v1
              with:
                  base: ${{ needs.detect.outputs.base }}
