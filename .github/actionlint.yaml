paths:
    # actionlint's bundled metadata for create-github-app-token predates v3,
    # which added `client-id` and deprecated `app-id`.
    .github/workflows/sync-repo-metadata.yaml:
        ignore:
            - 'input "client-id" is not defined'
            - 'missing input "app-id"'
