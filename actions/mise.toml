#
# Linters for the composite actions beside this file. Each action installs
# only its own tools from here, with this directory as mise's working
# directory, so the calling repository's `mise.toml` is never consulted and
# every caller lints with the same versions. Versions follow
# chewygumxx/nvim-config and chewygumxx/zsh-config.
#

[tools]
"aqua:editorconfig-checker/editorconfig-checker" = "4.0.2"
"aqua:koalaman/shellcheck"                       = "0.11.0"
"aqua:mvdan/sh"                                  = "3.14.1"
"aqua:rhysd/actionlint"                          = "1.7.12"
"aqua:tombi-toml/tombi"                          = "1.5.5"

# Not in the mise registry, so it comes from its GitHub releases.
"github:ewhauser/shuck" = "0.2.3"

# YAML. prettier is an npm package and yamllint a Python one; mise installs
# them with the Node and uv pinned here rather than whatever the runner has.
node                = "24.21.0"
"aqua:astral-sh/uv" = "0.12.19"
"npm:prettier"      = "3.9.9"
"pypi:yamllint"     = "1.38.0"
