name: Lint EditorConfig
description: >-
    Checks tracked files against `.editorconfig`: charset, line endings,
    trailing whitespace, final newlines and indent style.

inputs:
    base:
        description: >-
            Commit known to pass, such as the detect action's `base` output:
            only files changed since it are checked, or none when none
            changed, unless the linter's configuration changed. Empty checks
            every file.
        default: ""
    args:
        description: >-
            Arguments for editorconfig-checker. Indent size is off by default:
            YAML sequences, Markdown list continuations and verbatim licence
            text legitimately break it, and formatters own indentation anyway.
        default: -disable-indent-size

runs:
    using: composite
    steps:
        - name: Scope
          id: scope
          shell: bash
          env:
              LINT_BASE: ${{ inputs.base }}
          run: |
              scope=$("$GITHUB_ACTION_PATH/../lib/scope.sh" editorconfig)
              echo "scope=$scope" >> "$GITHUB_OUTPUT"
              [ "$scope" != changed ] || echo "base=$LINT_BASE" >> "$GITHUB_OUTPUT"

        - name: Setup mise
          if: steps.scope.outputs.scope != 'none'
          uses: jdx/mise-action@v4
          with:
              install: false
              add_shims_to_path: false
              working_directory: ${{ github.action_path }}/..
              cache_key_prefix: chewygumxx-lint

        - name: Install editorconfig-checker
          if: steps.scope.outputs.scope != 'none'
          shell: bash
          run: '"$GITHUB_ACTION_PATH/../lib/setup-tools.sh" aqua:editorconfig-checker/editorconfig-checker'

        - name: Lint
          if: steps.scope.outputs.scope != 'none'
          shell: bash
          env:
              LINT_BASE: ${{ steps.scope.outputs.base }}
              ARGS: ${{ inputs.args }}
          # ARGS is split on whitespace deliberately, to allow several flags.
          # Named files are excluded by the same defaults as the walk.
          run: |
              if [ -n "$LINT_BASE" ]; then
                  "$GITHUB_ACTION_PATH/../lib/tracked.sh" | xargs -0 -r editorconfig-checker $ARGS --
              else
                  editorconfig-checker $ARGS
              fi
