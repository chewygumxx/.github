name: Lint TOML
description: >-
    Checks formatting and lints tracked TOML files with tombi, offline. Uses
    the repository's tombi configuration, or the house style without one.

inputs:
    base:
        description: >-
            Commit known to pass, such as the detect action's `base` output:
            only files changed since it are linted, or none when none
            changed, unless the linter's configuration changed. Empty lints
            every file.
        default: ""

runs:
    using: composite
    steps:
        - name: Scope
          id: scope
          shell: bash
          env:
              LINT_BASE: ${{ inputs.base }}
          run: |
              scope=$("$GITHUB_ACTION_PATH/../lib/scope.sh" toml)
              echo "scope=$scope" >> "$GITHUB_OUTPUT"
              [ "$scope" != changed ] || echo "base=$LINT_BASE" >> "$GITHUB_OUTPUT"

        - name: Setup mise
          if: steps.scope.outputs.scope != 'none'
          uses: jdx/mise-action@v4
          with:
              install: false
              add_shims_to_path: false
              working_directory: ${{ github.action_path }}/..
              cache_key_prefix: chewygumxx-lint

        - name: Install tombi
          if: steps.scope.outputs.scope != 'none'
          shell: bash
          run: '"$GITHUB_ACTION_PATH/../lib/setup-tools.sh" aqua:tombi-toml/tombi'

        - name: Lint and Check Formatting
          if: steps.scope.outputs.scope != 'none'
          shell: bash
          env:
              LINT_BASE: ${{ steps.scope.outputs.base }}
          run: '"$GITHUB_ACTION_PATH/../lib/tombi.sh"'
