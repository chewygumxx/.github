name: Lint Workflows
description: >-
    Runs actionlint over the repository's workflows, with shellcheck checking
    their `run:` scripts. Configure it with `.github/actionlint.yaml`, or by
    declaring `@chewygumxx/actionlint-config`.

runs:
    using: composite
    steps:
        - name: Setup mise
          uses: jdx/mise-action@v4
          with:
              install: false
              add_shims_to_path: false
              working_directory: ${{ github.action_path }}/..
              cache_key_prefix: chewygumxx-lint

        - name: Install actionlint
          shell: bash
          run: '"$GITHUB_ACTION_PATH/../lib/setup-tools.sh" aqua:rhysd/actionlint aqua:koalaman/shellcheck'

        - name: Lint
          shell: bash
          run: '"$GITHUB_ACTION_PATH/../lib/actionlint.sh"'
