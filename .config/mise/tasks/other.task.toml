[commit]
extends = "cgxx:commit"

# Runs CI locally in Docker. The task is shared: callers reference
# `tasks/act` at v1, and run `ci.yaml`; this repository's CI is `self-test`,
# run against its own checkout.
[act]
description = "Run CI locally with act"
file        = "tasks/act"
env         = { ACT_WORKFLOW = "self-test.yaml" }
