#
#
# ~chewygumxx/.github.git
# ::: :/.github/workflows/self-test.yaml
#
#

# Runs this repository's composite actions against itself from the working
# tree, so a change to an action is exercised before a tag publishes it.
# (The reusable workflows reference the actions by tag and so cannot.)
# `commitlint.yaml` and `lint.yaml` reference no actions of their own, so
# they are called from the working tree too: they check this repository's
# commits and its `check` script, and exercise themselves in doing so.

name: Self Test

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch: {}

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            # The whole history, to find the last passing commit in.
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Detect
              id: detect
              uses: ./actions/detect

            - name: Lint Workflows
              if: steps.detect.outputs.actions-scope != 'none'
              uses: ./actions/lint-actions
              with:
                  base: ${{ steps.detect.outputs.base }}

            - name: Lint Shell Scripts
              if: steps.detect.outputs.shell-scope != 'none'
              uses: ./actions/lint-shell
              with:
                  base: ${{ steps.detect.outputs.base }}

            - name: Lint Zsh
              if: steps.detect.outputs.zsh-scope != 'none'
              uses: ./actions/lint-zsh
              with:
                  base: ${{ steps.detect.outputs.base }}

            - name: Lint TOML
              if: steps.detect.outputs.toml-scope != 'none'
              uses: ./actions/lint-toml
              with:
                  base: ${{ steps.detect.outputs.base }}

            - name: Lint YAML
              if: steps.detect.outputs.yaml-scope != 'none'
              uses: ./actions/lint-yaml
              with:
                  base: ${{ steps.detect.outputs.base }}

            - name: Lint EditorConfig
              if: steps.detect.outputs.editorconfig-scope != 'none'
              uses: ./actions/lint-editorconfig
              with:
                  base: ${{ steps.detect.outputs.base }}

            - name: Lint Em Dashes
              if: steps.detect.outputs.emdash-scope != 'none'
              uses: ./actions/lint-emdash
              with:
                  base: ${{ steps.detect.outputs.base }}

    commitlint:
        permissions:
            contents: read
            pull-requests: read
        uses: ./.github/workflows/commitlint.yaml

    check:
        permissions:
            contents: read
        uses: ./.github/workflows/lint.yaml
