#

# https://tombi-toml.github.io/tombi/docs/configuration
#
# The house style, copied from chewygumxx/nvim-config. `lib/tombi.sh`
# points `XDG_CONFIG_HOME` here, so tombi reads this as its user-level
# configuration: any `.tombi.toml`, `tombi.toml`, `.config/tombi.toml` or
# `[tool.tombi]` in the checked repository takes precedence over it.

toml-version = "v1.1.0"

[format]
[format.rules]
array-bracket-space-width       = 1
date-time-delimiter             = "space"
group-blank-lines-limit         = 2
indent-width                    = 4
key-value-equals-sign-alignment = true
trailing-comment-alignment      = true
trailing-comment-space-width    = 2
